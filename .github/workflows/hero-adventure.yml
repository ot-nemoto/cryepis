name: Advance hero adventure (text RPG)

on:
  schedule:
    # 日本時間 7:17
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "進めるゲーム"
        type: choice
        options: [master, develop]
        default: master

permissions:
  contents: read

jobs:
  targets:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
    steps:
      - id: branches
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.branch }}
        run: |
          if [ -n "$TARGET" ]; then
            branches=$(jq -cn --arg branch "$TARGET" '[$branch]')
          elif gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/develop" --jq '.[].ref' | grep -Fxq refs/heads/develop; then
            branches='["master","develop"]'
          else
            branches='["master"]'
          fi
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

  advance:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.targets.outputs.branches) }}
    concurrency:
      group: hero-adventure-${{ matrix.branch }}
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 待機中に同じゲームが更新されても、最新のセーブから進める。
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: tests
        name: Test
        run: python -m unittest discover -s tests

      - name: Advance production game
        if: matrix.branch == 'master'
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          RPG_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || 'https://ot-nemoto.github.io/warriors-road/' }}
        run: python scripts/rpg.py

      - name: Advance development game
        if: matrix.branch == 'develop'
        run: python scripts/rpg.py --no-gist

      # 1 人の処理が失敗しても、進められたもののふの状態は保存する。
      - name: Commit state
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          mkdir -p .state
          echo "$TODAY" > .state/last-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .state
          if ! git diff --cached --quiet; then
            git commit -m "chore: update state $TODAY"
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
