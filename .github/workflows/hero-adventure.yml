name: Advance hero adventure (text RPG)

# 現役の勇者（.state/heroes.json）を全員 1 日分進め、それぞれの Gist を更新する（進む歩数は乱数で決まる）。
# 状態は .state/heroes/<id>.json に保存し、最後に master にコミットする。勇者は new-game.yml で増やす。

on:
  schedule:
    # cron は UTC。JST 7:17 に実行（混雑する毎時 0 分を避けている）
    - cron: "17 22 * * *"
  workflow_dispatch:

concurrency:
  group: hero-adventure
  cancel-in-progress: false

permissions:
  contents: write # RPG の状態（.state/heroes*）と keepalive（.state/last-run）をコミットするために必要

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 起動時点の SHA ではなくブランチの先端を取る。実行が重なって待たされた場合も、
      # 先行の実行がコミットした .state/rpg.json の続きから進める
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests

      # Test が失敗した日は実行しない（状態も作らない）。勇者がいなければ何もしない。
      # 勇者ごとに失敗を隔離し、1 人でも失敗したらこのステップは失敗にする（ほかの勇者は進めて、状態もコミットする）。
      - name: Advance heroes
        if: ${{ success() }}
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
        run: python scripts/rpg.py

      # rpg.py が更新した状態（.state/heroes.json と .state/heroes/）を master にコミットする。
      # あわせて 60 日間アクティビティがないと scheduled workflow が停止するのを防ぐため、
      # .state/last-run も更新する（keepalive）。変更が無ければコミットしない。
      # Test が失敗した日も keepalive は残す（!cancelled()）。
      - name: Commit state (RPG + keepalive)
        if: ${{ !cancelled() }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          mkdir -p .state
          echo "$TODAY" > .state/last-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .state
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            if git diff --cached --quiet -- .state ':!.state/last-run'; then
              MSG="chore: keepalive $TODAY"
            else
              MSG="chore: update state $TODAY"
            fi
            git commit -m "$MSG"
            git pull --rebase
            git push
          fi
