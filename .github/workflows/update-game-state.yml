name: Update game state

# ゲームの状態（.state/）を読み、rpg.py で進めて（登録・引退も）、保存する。
# 保存先は、Variable R2_STATE_BRANCHES（空白区切り）に入っているゲームは Cloudflare R2、それ以外はそのブランチへのコミット（#301）。
# R2 のときは、R2 の最新（<branch>/latest.tar.gz）を取得し、保存するときはスナップショットを残してから最新を置き換える。

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      operation:
        required: true
        type: string
      hero:
        type: string
    secrets:
      GIST_PAT:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  # R2 に置くゲームなら、R2 から最新の状態を取得する（トークンは、コードを動かす run-game には渡さない）
  load-state:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      r2: ${{ steps.storage.outputs.r2 }}
      etag: ${{ steps.get.outputs.etag }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - id: storage
        env:
          BRANCH: ${{ inputs.branch }}
          R2_STATE_BRANCHES: ${{ vars.R2_STATE_BRANCHES }}
        run: |
          r2=false
          for b in $R2_STATE_BRANCHES; do
            if [ "$b" = "$BRANCH" ]; then r2=true; fi
          done
          echo "r2=$r2" >> "$GITHUB_OUTPUT"

      # R2 を扱う action は、いま動いているワークフローと同じコミット（master）のものを使う
      - if: steps.storage.outputs.r2 == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/actions
          persist-credentials: false

      - id: get
        if: steps.storage.outputs.r2 == 'true'
        uses: ./.github/actions/r2-state
        with:
          mode: get
          branch: ${{ inputs.branch }}
          file: ${{ runner.temp }}/state.tar.gz
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

      - id: upload
        if: steps.storage.outputs.r2 == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: game-state-in-${{ inputs.branch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/state.tar.gz
          if-no-files-found: error
          retention-days: 1

  run-game:
    needs: load-state
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source: ${{ steps.source.outputs.tree }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - if: needs.load-state.outputs.r2 == 'true'
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.load-state.outputs.artifact }}
          path: ${{ runner.temp }}/state-input

      # R2 に置くゲームは、R2 の状態で .state/ を置き換える（リポジトリの .state/ は使わない）
      - name: Use the state on R2
        if: needs.load-state.outputs.r2 == 'true'
        run: |
          rm -rf .state
          mkdir .state
          tar -xzf "$RUNNER_TEMP/state-input/state.tar.gz" -C .state

      # 保存するときに、取得してから別の実行が更新していないことを確かめるための目印
      # （R2 は最新の ETag、コミットは .state/ の tree）
      - id: source
        env:
          R2: ${{ needs.load-state.outputs.r2 }}
          ETAG: ${{ needs.load-state.outputs.etag }}
        run: |
          if [ "$R2" = true ]; then
            echo "tree=$ETAG" >> "$GITHUB_OUTPUT"
          else
            echo "tree=$(git rev-parse --verify -q HEAD:.state || printf absent)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: tests
        name: Test
        run: python -m unittest discover -s tests

      - name: Advance production game
        if: inputs.operation == 'advance' && inputs.branch == 'master'
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          RPG_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || 'https://ot-nemoto.github.io/warriors-road/' }}
        run: python scripts/rpg.py

      - name: Advance development game
        if: inputs.operation == 'advance' && inputs.branch == 'develop'
        run: python scripts/rpg.py --no-gist

      - name: Update hero roster
        if: inputs.operation != 'advance'
        env:
          OPERATION: ${{ inputs.operation }}
          HERO: ${{ inputs.hero }}
          RPG_SITE_URL: ${{ inputs.branch == 'master' && (vars.PRODUCTION_SITE_URL || 'https://ot-nemoto.github.io/warriors-road/') || (vars.CLOUDFLARE_PAGES_PROJECT != '' && format('https://develop.{0}.pages.dev/', vars.CLOUDFLARE_PAGES_PROJECT) || '') }}
        run: |
          case "$OPERATION" in
            new-game) python scripts/rpg.py --new-game "$HERO" ;;
            retire) python scripts/rpg.py --retire "$HERO" ;;
            *) exit 1 ;;
          esac

      - name: Record the last daily run
        if: ${{ !cancelled() && inputs.operation == 'advance' && steps.tests.outcome != 'skipped' }}
        run: |
          mkdir -p .state
          TZ=Asia/Tokyo date +%F > .state/last-run

      # 一部のもののふが失敗しても、進められた分の日次セーブは渡す。
      - id: upload
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && (success() || (inputs.operation == 'advance' && steps.tests.outcome != 'skipped')) }}
        with:
          name: game-state-${{ inputs.branch }}-${{ github.run_attempt }}
          path: .state/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  save-state:
    needs: [load-state, run-game]
    if: >-
      ${{ !cancelled() && needs.run-game.outputs.source != '' && needs.run-game.outputs.artifact != ''
          && (needs.run-game.result == 'success' || inputs.operation == 'advance') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 生成元のコードは実行しない。
      # R2: 状態をまとめて、R2 に保存する（R2 を扱う action は、いま動いているワークフローと同じコミットのもの）
      - if: needs.load-state.outputs.r2 == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/actions
          persist-credentials: false

      - if: needs.load-state.outputs.r2 == 'true'
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.run-game.outputs.artifact }}
          path: ${{ runner.temp }}/state-output

      - name: Pack state
        if: needs.load-state.outputs.r2 == 'true'
        run: tar -czf "$RUNNER_TEMP/state.tar.gz" -C "$RUNNER_TEMP/state-output" .

      - name: Save state to R2
        if: needs.load-state.outputs.r2 == 'true'
        uses: ./.github/actions/r2-state
        with:
          mode: put
          branch: ${{ inputs.branch }}
          file: ${{ runner.temp }}/state.tar.gz
          operation: ${{ inputs.operation }}
          etag: ${{ needs.run-game.outputs.source }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

      # コミット: 対象ブランチの .state/ だけを書き戻す。
      - if: needs.load-state.outputs.r2 != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          path: repository

      - if: needs.load-state.outputs.r2 != 'true'
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.run-game.outputs.artifact }}
          path: state-output

      - name: Commit state
        if: needs.load-state.outputs.r2 != 'true'
        working-directory: repository
        env:
          BRANCH: ${{ inputs.branch }}
          OPERATION: ${{ inputs.operation }}
          SOURCE: ${{ needs.run-game.outputs.source }}
        run: |
          case "$BRANCH" in master|develop) ;; *) exit 1 ;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2; do
            git fetch --no-tags --depth=1 origin "refs/heads/$BRANCH"
            git reset --hard FETCH_HEAD
            current=$(git rev-parse --verify -q HEAD:.state || printf absent)
            if [ "$current" != "$SOURCE" ]; then
              echo "セーブが別の実行で更新されています。最新の状態で再実行してください。"
              exit 1
            fi
            rm -rf .state
            mkdir .state
            cp -R ../state-output/. .state/
            git add -A .state/
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore: $OPERATION game state"
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              exit 0
            fi
            echo "保存先を取り直します（$attempt 回目）。"
          done
          exit 1
