name: CI

# PR を作った・更新したとき（と master に push したとき）に、リンター・フォーマット・テストを確かめる。
# リンターとフォーマッターは Ruff（設定は pyproject.toml。インデントはスペース 2）。

on:
  pull_request:
  push:
    branches: [master]

# 同じ PR の古い実行は取り消す（master への push は、コミットごとに結果が残るよう取り消さない）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUFF_VERSION: "0.17.4"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check --diff .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests
