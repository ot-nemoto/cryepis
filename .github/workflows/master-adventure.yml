name: Advance hero adventure (text RPG)

on:
  schedule:
    # 日本時間 7:17
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advance:
    if: github.ref == 'refs/heads/master'
    concurrency:
      group: hero-adventure-master
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/update-game-state.yml
    with:
      branch: master
      operation: advance
    secrets:
      GIST_PAT: ${{ secrets.GIST_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
