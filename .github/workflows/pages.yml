name: Publish site (GitHub Pages)

# CI（リンター・フォーマット・テスト）と、サイトの公開をまとめたワークフロー。
# - PR を作った・更新したとき: CI だけ（公開はしない）
# - master に push されたとき（世界やプログラムを変えたとき）: CI が通ったら公開する
# - 毎日の実行・もののふの登録・引退のあと（それらのコミットは GITHUB_TOKEN なので push では動かないため workflow_run で受ける）:
#   CI が通ったら公開する（毎日の公開は、テストが通れば公開する。リンター・フォーマットの失敗では止めない）
# - 手動: 選んだブランチで CI を走らせ、master のときだけ公開する
# 公開: 今の状態（.state/）と世界（world/）から、絵図・番付・町・口入れ屋・武具のサイトを書き出して
# GitHub Pages に公開する（scripts/website.py。冒険は進めない。書き出したファイルはコミットしない）。
# 公開の deploy-pages が一時的に失敗したら、30 秒待って 1 回だけやり直す。
# CI と公開は、最初に決めた同じコミット（resolve の sha）で行う（途中で master が進んでも、確かめていないものは公開しない）。
# リポジトリの Settings → Pages の Source を「GitHub Actions」にしておくこと。
# リンターとフォーマッターは Ruff（設定は pyproject.toml。インデントはスペース 2）。

on:
  pull_request:
  push:
    branches: [master, develop]
  workflow_run:
    workflows: ["Advance hero adventure (text RPG)", "New game (add a hero)", "Retire hero"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# PR は同じ PR の古い実行を取り消す。それ以外は取り消さない（コミットごとに CI の結果を残す）。
# 公開どうしの順番は、publish ジョブの concurrency で決める
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  RUFF_VERSION: "0.17.4"

jobs:
  # CI と公開で使うコミットを 1 つに決める。
  # PR・push・手動はそのきっかけのコミット、workflow_run は、毎日の実行などがコミットしたあとの master の先端
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      targets: ${{ steps.sha.outputs.targets }}
    steps:
      - id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          else
            sha="$GITHUB_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          targets='[]'
          add_target() {
            targets=$(jq -c --arg branch "$1" --arg sha "$2" '. + [{branch:$branch,sha:$sha}]' <<< "$targets")
          }
          if [ "$EVENT" = pull_request ]; then
            if [ "$BASE_REF" = master ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
              add_target "pr-$PR_NUMBER" "$sha"
            fi
          elif [ "$EVENT" = workflow_run ]; then
            add_target master "$sha"
            develop_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/develop" --jq '.[] | select(.ref == "refs/heads/develop") | .object.sha')
            if [ -n "$develop_sha" ]; then
              add_target develop "$develop_sha"
            fi
          elif [[ "$GITHUB_REF" == refs/heads/master || "$GITHUB_REF" == refs/heads/develop ]]; then
            add_target "$GITHUB_REF_NAME" "$sha"
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  lint:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check --diff .

  release-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the proposed merge
        run: python tools/release.py --check HEAD^1 HEAD

  test:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests

  publish:
    needs: [resolve, lint, test]
    # master のときだけ公開する。テストは必ず通っていること。リンター・フォーマットは、毎日の実行のあと（workflow_run）は
    # 失敗していても公開する（コードの書き方の問題で、毎日の状態の公開を止めないため）
    if: >-
      ${{ always() && github.event_name != 'pull_request'
          && (github.event_name == 'workflow_run' || github.ref_name == github.event.repository.default_branch)
          && needs.resolve.result == 'success' && needs.test.result == 'success'
          && (needs.lint.result == 'success' || github.event_name == 'workflow_run') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 公開は途中で止めると壊れることがあるので、実行中のものは止めない（待っている古い公開は、新しいものに置き換わる）
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy_retry.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Identify training inputs
        id: training
        run: echo "key=$(python scripts/training.py)" >> "$GITHUB_OUTPUT"

      - name: Cache training results
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cryepis-training.json
          key: ${{ steps.training.outputs.key }}

      - name: Build site
        env:
          PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
        run: |
          args=()
          if [ -n "$PRODUCTION_SITE_URL" ]; then
            args+=(--redirect-to "$PRODUCTION_SITE_URL")
          fi
          python scripts/website.py _site --training-cache "$RUNNER_TEMP/cryepis-training.json" "${args[@]}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # deploy-pages は、アップロード直後のアーティファクトが API から見えず（Found 0 artifact(s)）、たまに失敗する。
      # 一時的な問題なので、失敗したら少し待って 1 回だけやり直す（2 回とも失敗したときだけジョブを失敗にする）
      # （待っても直らないとき、たとえばアップロードが登録されていないときは、Actions で Re-run failed jobs する）
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: ${{ steps.deploy.outcome == 'failure' }}
        run: sleep 30

      - id: deploy_retry
        if: ${{ steps.deploy.outcome == 'failure' }}
        uses: actions/deploy-pages@v5

  cloudflare-build:
    if: >-
      ${{ always() && !cancelled() && needs.resolve.result == 'success'
          && vars.CLOUDFLARE_PAGES_PROJECT != '' && needs.resolve.outputs.targets != '[]' }}
    needs: [resolve, lint, test, release-check]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check build prerequisites
        if: matrix.target.sha == needs.resolve.outputs.sha
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          RELEASE_RESULT: ${{ needs.release-check.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$LINT_RESULT" = success || test "$GITHUB_EVENT_NAME" = workflow_run
          test "$RELEASE_RESULT" = success || test "$RELEASE_RESULT" = skipped

      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.target.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint the development snapshot
        if: matrix.target.sha != needs.resolve.outputs.sha
        run: |
          pip install "ruff==$RUFF_VERSION"
          ruff check --output-format=github .
          ruff format --check --diff .

      - name: Test the development snapshot
        if: matrix.target.sha != needs.resolve.outputs.sha
        run: python -m unittest discover -s tests

      - name: Identify training inputs
        id: training
        run: echo "key=$(python scripts/training.py)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cryepis-training.json
          key: ${{ steps.training.outputs.key }}

      - name: Generate pages
        run: python scripts/website.py _site --training-cache "$RUNNER_TEMP/cryepis-training.json"

      - uses: actions/upload-artifact@v6
        with:
          name: cloudflare-${{ matrix.target.branch }}
          path: _site
          if-no-files-found: error
          retention-days: 1


  cloudflare-deploy:
    if: >-
      ${{ always() && !cancelled() && needs.resolve.result == 'success'
          && (needs.cloudflare-build.result == 'success' || needs.cloudflare-build.result == 'failure') }}
    needs: [resolve, cloudflare-build]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-pages-${{ matrix.target.branch }}
      queue: max
    steps:
      # PR のコードはチェックアウトせず、生成済みのファイルだけを配信する。
      - uses: actions/download-artifact@v7
        with:
          pattern: cloudflare-${{ matrix.target.branch }}
          path: pages-output

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.target.branch }}
          SHA: ${{ matrix.target.sha }}
        run: |
          set -euo pipefail
          output="pages-output/cloudflare-$BRANCH"
          if [ ! -d "$output" ]; then
            echo "配信できる生成物がありません。"
            exit 0
          fi
          case "$BRANCH" in
            pr-*)
              current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${BRANCH#pr-}" --jq 'select(.state == "open") | .merge_commit_sha')
              url="https://$BRANCH.$PROJECT.pages.dev/"
              ;;
            develop|master)
              current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)
              url="https://$PROJECT.pages.dev/"
              if [ "$BRANCH" = develop ]; then
                url="https://develop.$PROJECT.pages.dev/"
              fi
              ;;
            *) exit 1 ;;
          esac
          if [ "$current" != "$SHA" ]; then
            echo "$BRANCH は更新済みなので、この生成物の公開を省きます。"
            exit 0
          fi
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID を設定してください}"
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN を設定してください}"
          production_branch=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            | jq -er '.result.production_branch')
          if [ "$production_branch" != master ]; then
            echo "Cloudflare Pages の本番ブランチを master に設定してください。"
            exit 1
          fi
          npx --yes wrangler@4.168.0 pages deploy "$output" --project-name "$PROJECT" --branch "$BRANCH" --commit-hash "$SHA"
          printf -- '- %s [%s](%s)\n' "$BRANCH" "$url" "$url" >> "$GITHUB_STEP_SUMMARY"
