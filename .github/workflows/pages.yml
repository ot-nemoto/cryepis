name: Publish site (GitHub Pages)

# CI（リンター・フォーマット・テスト）と、サイトの公開をまとめたワークフロー。
# - PR を作った・更新したとき: CI だけ（公開はしない）
# - master に push されたとき（世界やプログラムを変えたとき）: CI が通ったら公開する
# - 毎日の実行・もののふの登録・引退のあと（それらのコミットは GITHUB_TOKEN なので push では動かないため workflow_run で受ける）:
#   CI が通ったら公開する（毎日の公開は、テストが通れば公開する。リンター・フォーマットの失敗では止めない）
# - 手動: 選んだブランチで CI を走らせ、master のときだけ公開する
# 公開: 今の状態（.state/）と世界（world/）から、絵図・番付・町・口入れ屋・武具のサイトを書き出して
# GitHub Pages に公開する（scripts/website.py。冒険は進めない。書き出したファイルはコミットしない）。
# 公開の deploy-pages が一時的に失敗したら、30 秒待って 1 回だけやり直す。
# CI と公開は、最初に決めた同じコミット（resolve の sha）で行う（途中で master が進んでも、確かめていないものは公開しない）。
# リポジトリの Settings → Pages の Source を「GitHub Actions」にしておくこと。
# リンターとフォーマッターは Ruff（設定は pyproject.toml。インデントはスペース 2）。

on:
  pull_request:
  push:
    branches: [master, develop]
  workflow_run:
    workflows: ["Advance hero adventure (text RPG)", "Advance development game", "New game (add a hero)", "Retire hero"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# PR は同じ PR の古い実行を取り消す。それ以外は取り消さない（コミットごとに CI の結果を残す）。
# 公開どうしの順番は、publish ジョブの concurrency で決める
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  RUFF_VERSION: "0.17.4"

jobs:
  # CI と公開で使うコミットを 1 つに決める。
  # PR・push・手動はそのきっかけのコミット、workflow_run は、更新したゲームのブランチの先端
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      branch: ${{ steps.sha.outputs.branch }}
    steps:
      - id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATE_WORKFLOW: ${{ github.event.workflow_run.name }}
          STATE_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          sha="$GITHUB_SHA"
          branch=''
          if [ "$EVENT" = pull_request ]; then
            if [ "$BASE_REF" = master ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
              branch="pr-$PR_NUMBER"
            fi
          elif [ "$EVENT" = workflow_run ]; then
            branch=master
            case "$STATE_WORKFLOW:$STATE_TITLE" in
              'Advance development game:'*|*':New game (develop)'|*':Retire hero (develop)') branch=develop ;;
            esac
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$branch" \
              --jq ".[] | select(.ref == \"refs/heads/$branch\") | .object.sha")
            if [ -z "$sha" ]; then
              branch=''
            fi
          elif [[ "$GITHUB_REF" == refs/heads/master || "$GITHUB_REF" == refs/heads/develop ]]; then
            branch="$GITHUB_REF_NAME"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  # ゲームの状態を R2 に置いているとき（Variable R2_STATE_BRANCHES。#301）、書き出しに使う状態を R2 から取得する。
  # 本番 PR のプレビューは本番（master）の状態を使う。トークンは、コードを動かすジョブには渡さない
  load-state:
    needs: resolve
    if: needs.resolve.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      r2: ${{ steps.storage.outputs.r2 }}
      game: ${{ steps.storage.outputs.game }}
      etag: ${{ steps.get.outputs.etag }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - id: storage
        env:
          BRANCH: ${{ needs.resolve.outputs.branch }}
          R2_STATE_BRANCHES: ${{ vars.R2_STATE_BRANCHES }}
        run: |
          game="$BRANCH"
          case "$BRANCH" in pr-*) game=master ;; esac
          r2=false
          for b in $R2_STATE_BRANCHES; do
            if [ "$b" = "$game" ]; then r2=true; fi
          done
          echo "game=$game" >> "$GITHUB_OUTPUT"
          echo "r2=$r2" >> "$GITHUB_OUTPUT"

      # R2 を扱う action は master のものを使う（PR のコードは動かさない）
      - if: steps.storage.outputs.r2 == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions
          persist-credentials: false

      - id: get
        if: steps.storage.outputs.r2 == 'true'
        uses: ./.github/actions/r2-state
        with:
          mode: get
          branch: ${{ steps.storage.outputs.game }}
          file: ${{ runner.temp }}/state.tar.gz
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

      - id: upload
        if: steps.storage.outputs.r2 == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: game-state-${{ needs.resolve.outputs.branch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/state.tar.gz
          if-no-files-found: error
          retention-days: 1

  lint:
    needs: resolve
    if: needs.resolve.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check --diff .

  release-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the proposed merge
        run: python tools/release.py --check HEAD^1 HEAD

  test:
    needs: resolve
    if: needs.resolve.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests

  publish:
    needs: [resolve, load-state, lint, test]
    # master のときだけ公開する。テストは必ず通っていること。リンター・フォーマットは、毎日の実行のあと（workflow_run）は
    # 失敗していても公開する（コードの書き方の問題で、毎日の状態の公開を止めないため）
    if: >-
      ${{ always() && needs.resolve.outputs.branch == 'master'
          && needs.resolve.result == 'success' && needs.load-state.result == 'success' && needs.test.result == 'success'
          && (needs.lint.result == 'success' || github.event_name == 'workflow_run') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 公開は途中で止めると壊れることがあるので、実行中のものは止めない（待っている古い公開は、新しいものに置き換わる）
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy_retry.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - if: needs.load-state.outputs.r2 == 'true'
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.load-state.outputs.artifact }}
          path: ${{ runner.temp }}/state-input

      # R2 に置いているゲームは、R2 の状態で .state/ を置き換える
      - name: Use the state on R2
        if: needs.load-state.outputs.r2 == 'true'
        run: |
          rm -rf .state
          mkdir .state
          tar -xzf "$RUNNER_TEMP/state-input/state.tar.gz" -C .state

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Identify training inputs
        id: training
        run: echo "key=$(python scripts/training.py)" >> "$GITHUB_OUTPUT"

      - name: Cache training results
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cryepis-training.json
          key: ${{ steps.training.outputs.key }}

      - name: Build site
        env:
          PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
        run: |
          args=()
          if [ -n "$PRODUCTION_SITE_URL" ]; then
            args+=(--redirect-to "$PRODUCTION_SITE_URL")
          fi
          python scripts/website.py _site --training-cache "$RUNNER_TEMP/cryepis-training.json" "${args[@]}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # deploy-pages は、アップロード直後のアーティファクトが API から見えず（Found 0 artifact(s)）、たまに失敗する。
      # 一時的な問題なので、失敗したら少し待って 1 回だけやり直す（2 回とも失敗したときだけジョブを失敗にする）
      # （待っても直らないとき、たとえばアップロードが登録されていないときは、Actions で Re-run failed jobs する）
      # R2 に置いたゲームは、書き出しに使った状態が今も最新か確かめる。別の実行が先に新しい状態を保存していたら、
      # この（古い状態の）書き出しは公開しない（R2 ではコミットが増えないので、コミットの比較では見分けられない）
      - if: needs.load-state.outputs.r2 == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions
          path: r2-action
          persist-credentials: false

      - id: latest
        if: needs.load-state.outputs.r2 == 'true'
        uses: ./r2-action/.github/actions/r2-state
        with:
          mode: etag
          branch: ${{ needs.load-state.outputs.game }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

      - id: fresh
        env:
          R2: ${{ needs.load-state.outputs.r2 }}
          BUILT: ${{ needs.load-state.outputs.etag }}
          LATEST: ${{ steps.latest.outputs.etag }}
        run: |
          if [ "$R2" = true ] && [ "$BUILT" != "$LATEST" ]; then
            echo "R2 の状態が書き出したあとで更新されたので、この生成物の公開を省きます。"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - id: deploy
        if: steps.fresh.outputs.ok == 'true'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: ${{ steps.deploy.outcome == 'failure' }}
        run: sleep 30

      - id: deploy_retry
        if: ${{ steps.deploy.outcome == 'failure' }}
        uses: actions/deploy-pages@v5

  cloudflare-build:
    if: >-
      ${{ always() && !cancelled() && needs.resolve.result == 'success'
          && vars.CLOUDFLARE_PAGES_PROJECT != '' && needs.resolve.outputs.branch != ''
          && needs.test.result == 'success'
          && (needs.lint.result == 'success' || (github.event_name == 'workflow_run' && needs.resolve.outputs.branch == 'master'))
          && (needs.release-check.result == 'success' || needs.release-check.result == 'skipped')
          && needs.load-state.result == 'success' }}
    needs: [resolve, load-state, lint, test, release-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - if: needs.load-state.outputs.r2 == 'true'
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.load-state.outputs.artifact }}
          path: ${{ runner.temp }}/state-input

      # R2 に置いているゲームは、R2 の状態で .state/ を置き換える
      - name: Use the state on R2
        if: needs.load-state.outputs.r2 == 'true'
        run: |
          rm -rf .state
          mkdir .state
          tar -xzf "$RUNNER_TEMP/state-input/state.tar.gz" -C .state

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Identify training inputs
        id: training
        run: echo "key=$(python scripts/training.py)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cryepis-training.json
          key: ${{ steps.training.outputs.key }}

      - name: Generate pages
        run: python scripts/website.py _site --training-cache "$RUNNER_TEMP/cryepis-training.json"

      - id: upload
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-${{ needs.resolve.outputs.branch }}-${{ github.run_attempt }}
          path: _site
          if-no-files-found: error
          retention-days: 1


  cloudflare-deploy:
    # release-check は PR 専用。通常のブランチ更新では、そのスキップを配信に伝播させない。
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.cloudflare-build.result == 'success' }}
    needs: [resolve, load-state, cloudflare-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-pages-${{ needs.resolve.outputs.branch }}
      queue: max
    steps:
      # PR のコードはチェックアウトせず、生成済みのファイルだけを配信する。
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.cloudflare-build.outputs.artifact }}
          path: pages-output

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # R2 に置いたゲームは、書き出しに使った状態が今も最新か確かめる。別の実行が先に新しい状態を保存していたら、
      # この（古い状態の）書き出しは公開しない（R2 ではコミットが増えないので、コミットの比較では見分けられない）
      - if: needs.load-state.outputs.r2 == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions
          path: r2-action
          persist-credentials: false

      - id: latest
        if: needs.load-state.outputs.r2 == 'true'
        uses: ./r2-action/.github/actions/r2-state
        with:
          mode: etag
          branch: ${{ needs.load-state.outputs.game }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

      - id: fresh
        env:
          R2: ${{ needs.load-state.outputs.r2 }}
          BUILT: ${{ needs.load-state.outputs.etag }}
          LATEST: ${{ steps.latest.outputs.etag }}
        run: |
          if [ "$R2" = true ] && [ "$BUILT" != "$LATEST" ]; then
            echo "R2 の状態が書き出したあとで更新されたので、この生成物の公開を省きます。"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Cloudflare Pages
        if: steps.fresh.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          test -s pages-output/index.html
          case "$BRANCH" in
            pr-*)
              current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${BRANCH#pr-}" --jq 'select(.state == "open") | .merge_commit_sha')
              url="https://$BRANCH.$PROJECT.pages.dev/"
              ;;
            develop|master)
              current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)
              url="https://$PROJECT.pages.dev/"
              if [ "$BRANCH" = develop ]; then
                url="https://develop.$PROJECT.pages.dev/"
              fi
              ;;
            *) exit 1 ;;
          esac
          if [ "$current" != "$SHA" ]; then
            echo "$BRANCH は更新済みなので、この生成物の公開を省きます。"
            exit 0
          fi
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID を設定してください}"
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN を設定してください}"
          production_branch=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            | jq -er '.result.production_branch')
          if [ "$production_branch" != master ]; then
            echo "Cloudflare Pages の本番ブランチを master に設定してください。"
            exit 1
          fi
          npx --yes wrangler@4.168.0 pages deploy pages-output --project-name "$PROJECT" --branch "$BRANCH" --commit-hash "$SHA"
          printf -- '- %s [%s](%s)\n' "$BRANCH" "$url" "$url" >> "$GITHUB_STEP_SUMMARY"
