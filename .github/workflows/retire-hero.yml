name: Retire hero

# もののふを引退させる: もののふの ID（h1 など）か名前を入れて手動実行すると、もののふ管理シート（.state/heroes.json）で
# そのもののふが現役ではなくなり、毎日の更新の対象から外れる（状態は残り、サイトの詳細のページも残る。枠が 1 つ空く）。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "変更するゲーム"
        type: choice
        options: [master, develop]
        default: master
      hero:
        description: "引退させるもののふの ID（h1 など）または名前"
        type: string
        required: true

concurrency:
  group: hero-adventure-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retire:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests

      - name: Retire hero
        env:
          RPG_SITE_URL: ${{ inputs.branch == 'master' && (vars.PRODUCTION_SITE_URL || 'https://ot-nemoto.github.io/warriors-road/') || (vars.CLOUDFLARE_PAGES_PROJECT != '' && format('https://develop.{0}.pages.dev/', vars.CLOUDFLARE_PAGES_PROJECT) || '') }}
          HERO: ${{ inputs.hero }}
        run: python scripts/rpg.py --retire "$HERO"

      - name: Commit state
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .state
          git commit -m "chore: retire hero"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:refs/heads/$BRANCH"
