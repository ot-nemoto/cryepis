name: Retire hero
run-name: Retire hero (${{ inputs.branch }})

# もののふを引退させる: もののふの ID（h1 など）か名前を入れて手動実行すると、もののふ管理シート（.state/heroes.json）で
# そのもののふが現役ではなくなり、毎日の更新の対象から外れる（状態は残り、サイトの詳細のページも残る。枠が 1 つ空く）。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "変更するゲーム"
        type: choice
        options: [master, develop]
        default: master
      hero:
        description: "引退させるもののふの ID（h1 など）または名前"
        type: string
        required: true

concurrency:
  group: hero-adventure-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retire:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/update-game-state.yml
    with:
      branch: ${{ inputs.branch }}
      operation: retire
      hero: ${{ inputs.hero }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
