name: New game (add a hero)
run-name: New game (${{ inputs.branch }})

# 新しいもののふを登録する: もののふの名前を入れて手動実行すると、もののふ管理シート（.state/heroes.json）・
# もののふの状態（.state/heroes/<id>.json）を選んだブランチにコミットする（Gist は作らない。もののふの詳細はサイトで見る）。
# もののふは最大 30 人（引退したもののふは数えない）。冒険は次回の毎日の実行（master-adventure.yml）から進む。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "変更するゲーム"
        type: choice
        options: [master, develop]
        default: master
      hero_name:
        description: "もののふの名前（表示幅 32 まで（全角 16 文字・半角 32 文字）。超えた分は切り捨てる）"
        type: string
        required: true

# 毎日の実行・引退と同じグループにして、.state/ への書き込みを直列にする
concurrency:
  group: hero-adventure-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  new-game:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/update-game-state.yml
    with:
      branch: ${{ inputs.branch }}
      operation: new-game
      hero: ${{ inputs.hero_name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
