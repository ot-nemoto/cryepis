name: Update honeypot gists

# ハニーポットの集計（VM が Object Storage に置いたもの）を取得し、Pinned Gist（最大 6 枚）を更新する。
# 生のログや IP には触れず、集計 JSON を読むだけ。

on:
  schedule:
    # cron は UTC。JST 7:17 に実行（VM の集計は 00:10 UTC なので、その後）
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      create_gists:
        description: "6 枚の Gist をまとめて作る（作るだけ。ID はサマリーに出る）"
        type: boolean
        default: false

concurrency:
  group: update-gists
  cancel-in-progress: false

permissions:
  contents: write # keepalive（.state/last-run）のコミットに必要

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        id: test
        run: python -m unittest discover -s tests

      # 手動実行で create_gists を指定したときだけ。GIST_IDS が設定済みなら作らずに失敗する
      - name: Create gists
        if: ${{ inputs.create_gists }}
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_IDS: ${{ vars.GIST_IDS }}
        run: python scripts/report.py --create-gists

      # Test が成功し、Gist を作るだけの実行でないときに、集計を取得して Gist を更新する
      - name: Update gists
        if: ${{ success() && !inputs.create_gists }}
        env:
          HONEYPOT_DATA_URL: ${{ secrets.HONEYPOT_DATA_URL }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_IDS: ${{ vars.GIST_IDS }}
        run: python scripts/report.py

      # 60 日間アクティビティが無いと scheduled workflow が止まるのを防ぐ keepalive。
      # 変更が無ければコミットしない。
      - name: Commit keepalive
        if: ${{ !cancelled() }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          mkdir -p .state
          echo "$TODAY" > .state/last-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/last-run
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: keepalive $TODAY"
            git pull --rebase
            git push
          fi
