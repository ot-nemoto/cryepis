# Cowrie の最小設定。安全のため、ファイルの取得と転送は無効にする。
# 本物らしく見せる値（hostname など）は、見破られにくいよう VM の上で各自変えてよい。
[honeypot]
hostname = srv01
# 取得しようとしたファイルは保存しない（容量 0）
download_limit_size = 0

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
# 踏み台にさせないため、ポート転送は無効
forwarding = false
forward_redirect = false
forward_tunnel = false
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
