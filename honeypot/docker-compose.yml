# VM で動かすハニーポット一式（Cowrie と HTTP の受け口）。手順は docs/HONEYPOT.md。
# 本物の SSH は別ポート（22222）に移しておくこと。ここでは 2222/2223/80/443 で待ち受け、
# iptables で 22->2222, 23->2223 に転送する（setup-iptables.sh）。
services:
  cowrie:
    image: cowrie/cowrie:latest
    restart: unless-stopped
    user: "1000:1000" # root では動かさない
    read_only: true
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "2222:2222" # SSH
      - "2223:2223" # Telnet
    volumes:
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - cowrie-log:/cowrie/cowrie-git/var/log/cowrie
      - cowrie-dl:/cowrie/cowrie-git/var/lib/cowrie/downloads

  http:
    image: python:3.12-slim
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.25
    command: python3 /app/http_server.py --port 8080 --log /log/requests.log
    ports:
      - "80:8080"
    volumes:
      - ./http_server.py:/app/http_server.py:ro
      - http-log:/log

volumes:
  cowrie-log:
  cowrie-dl:
  http-log:
